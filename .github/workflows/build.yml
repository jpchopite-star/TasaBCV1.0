name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Find and build project
        shell: bash
        run: |
          echo "Files in repository:"; ls -la
          for z in *.zip; do [ -e "$z" ] && unzip -oq "$z" -d src; done
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "Building in: $DIR"
          cd "$DIR"
          gradle assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/TasaBCV.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TasaBCV-apk
          path: out/TasaBCV.apk
